name: Deploy site
# Builds the website and refreshes its data snapshot about every 15 minutes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fintel-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintel-project/package-lock.json
      - run: npm ci
      - name: Today
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Company files (SEC financials + Form 4) are rebuilt once a day; the cache carries them between runs.
      - uses: actions/cache@v4
        with:
          path: fintel-project/public/snap/co
          key: companies-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: |
            companies-${{ steps.day.outputs.d }}-
            companies-
      - name: Snapshot data
        run: npx vite-node scripts/snapshot.ts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COMPANIES_MAX_AGE_H: '20'
      - name: Build
        run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_STATIC: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fintel-project/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
